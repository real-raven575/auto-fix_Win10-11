name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Windows PowerShell 5.1 ships with every Windows 10/11 PC; pwsh is PowerShell 7.
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint
        run: |
          $settings = './PSScriptAnalyzerSettings.psd1'
          $issues = @(Invoke-ScriptAnalyzer -Path ./AutoFixer -Recurse -Settings $settings -Severity Error, Warning) +
            @(Invoke-ScriptAnalyzer -Path ./Start-AutoFixer.ps1 -Settings $settings -Severity Error, Warning)
          $issues | Format-Table -AutoSize | Out-String | Write-Host
          if ($issues.Count -gt 0) { throw "$($issues.Count) analyzer issue(s)" }

      # Run the tests even when lint fails, so one CI run reports both.
      - name: Pester
        if: success() || failure()
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results.xml'
          Invoke-Pester -Configuration $config

      # A step that fails on a real PC must fail CI too, not just print [failed ].
      - name: Real scan smoke test (read-only)
        if: success() || failure()
        run: |
          & ./Start-AutoFixer.ps1 -NoMenu -OutputRoot "$env:RUNNER_TEMP/runs"
          $json = Get-ChildItem "$env:RUNNER_TEMP/runs" -Recurse -Filter results.json | Sort-Object LastWriteTime | Select-Object -Last 1
          $failed = @((Get-Content $json.FullName -Raw | ConvertFrom-Json).steps | Where-Object status -eq 'Failed')
          $failed | ForEach-Object { Write-Host ('Failed step: {0} - {1}' -f $_.name, $_.summary) }
          if ($failed.Count -gt 0) { throw "$($failed.Count) scan step(s) failed" }

      # The double-click launcher: runner is already admin, so no UAC prompt; AUTOFIX_CI skips -Open and pause.
      - name: Launcher smoke test (AutoFix.bat)
        if: success() || failure()
        env:
          AUTOFIX_CI: '1'
        run: |
          cmd.exe /d /c AutoFix.bat
          if ($LASTEXITCODE -ne 0) { throw "AutoFix.bat exited with $LASTEXITCODE" }
          $json = Get-ChildItem "$env:ProgramData/AutoFixer/Runs" -Recurse -Filter results.json | Sort-Object LastWriteTime | Select-Object -Last 1
          $failed = @((Get-Content $json.FullName -Raw | ConvertFrom-Json).steps | Where-Object status -eq 'Failed')
          if ($failed.Count -gt 0) { throw "$($failed.Count) scan step(s) failed via AutoFix.bat" }

      - name: Upload test results and sample report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.shell }}
          path: |
            test-results.xml
            ${{ runner.temp }}/runs
