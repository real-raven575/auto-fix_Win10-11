name: Bug report
description: Auto-Fixer broke, froze, or said something wrong about a PC.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. **Please never paste passwords, computer names, user names or full unredacted logs.** Auto-Fixer's saved reports are redacted by default, so those are safe to attach.
  - type: input
    id: version
    attributes:
      label: Auto-Fixer version
      description: Shown on the About screen (press A), for example 1.3.3.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows and PowerShell
      description: For example "Windows 11 24H2, PowerShell 5.1".
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Standard, Technician]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: "1. Main menu 3\n2. ..."
